[package]
name        = "turbocable-server"
version     = "0.1.0"
edition     = "2021"
description = "High-performance WebSocket gateway for TurboCable (1M+ connections)"
license     = "MIT"
repository  = "https://github.com/samaswin/turbocable-server"
rust-version = "1.78"

[dependencies]
jemallocator      = "0.5"
tokio             = { version = "1",   features = ["full"] }
axum              = { version = "0.7", features = ["ws"] }
async-nats        = "0.35"
rmp-serde         = "1.3"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
jsonwebtoken      = "9"
dashmap           = "5"
bytes             = "1"
smallvec          = { version = "1", features = ["union"] }
prometheus        = { version = "0.13", features = ["process"] }
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap              = { version = "4", features = ["derive", "env"] }
thiserror         = "1"
uuid              = { version = "1", features = ["v4", "fast-rng"] }
num_cpus          = "1"
socket2           = { version = "0.5", features = ["all"] }
rlimit            = "0.10"

[dependencies.futures]
version = "0.3"

[dev-dependencies]
tokio-test = "0.4"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
