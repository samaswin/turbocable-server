[features]
# Exposes internal protocol and auth modules for the fuzz sub-crate.
# Not intended for normal builds or tests.
fuzz = []

[package]
name        = "turbocable-server"
version     = "0.5.0"
edition     = "2021"
description = "High-performance WebSocket gateway for TurboCable (1M+ connections)"
license     = "MIT"
repository  = "https://github.com/samaswin/turbocable-server"
rust-version = "1.88"

[dependencies]
tokio             = { version = "1",   features = ["full"] }
axum              = { version = "0.7", features = ["ws"] }
async-nats        = "0.46"
rmp-serde         = "1.3"
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
jsonwebtoken      = "9"
dashmap           = "5"
bytes             = "1"
smallvec          = { version = "1", features = ["union"] }
prometheus        = { version = "0.13", features = ["process"], default-features = false }
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap              = { version = "4", features = ["derive", "env"] }
thiserror         = "1"
uuid              = { version = "1", features = ["v4", "fast-rng"] }
num_cpus          = "1"
socket2           = { version = "0.5", features = ["all"] }
rlimit            = "0.10"
time              = ">=0.3.47"
time-core         = ">=0.1.0"
time-macros       = ">=0.2.19"

[dependencies.futures]
version = "0.3"

# jemalloc is only used on glibc Linux; musl and macOS use the system allocator
[target.'cfg(all(target_os = "linux", not(target_env = "musl")))'.dependencies]
jemallocator = "0.5"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
tokio-tungstenite = "0.21"

[[bench]]
name = "registry_bench"
harness = false

[[bin]]
name = "tc-publish"
path = "src/bin/publish.rs"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
