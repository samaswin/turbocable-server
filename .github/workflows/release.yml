name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: turbocable/server

# ── Linux musl builds (cross-compiled via `cross`) ────────────────────────────
jobs:
  build-linux:
    name: Build Linux / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: turbocable-server-x86_64-linux
            docker_arch: amd64
          - target: aarch64-unknown-linux-musl
            artifact: turbocable-server-aarch64-linux
            docker_arch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Build (cross)
        run: cross build --release --target ${{ matrix.target }}

      - name: Verify static binary
        run: |
          binary=target/${{ matrix.target }}/release/turbocable-server
          if file "$binary" | grep -qE "statically linked|static-pie linked"; then
            echo "OK: binary is statically linked"
          else
            file "$binary"
            echo "ERROR: binary is not statically linked" && exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/turbocable-server
          retention-days: 1

      # Stage binary for Docker multi-platform context
      - name: Stage for Docker
        run: |
          mkdir -p dist/linux/${{ matrix.docker_arch }}
          cp target/${{ matrix.target }}/release/turbocable-server \
             dist/linux/${{ matrix.docker_arch }}/turbocable-server
          chmod +x dist/linux/${{ matrix.docker_arch }}/turbocable-server

      - name: Upload Docker stage
        uses: actions/upload-artifact@v4
        with:
          name: docker-linux-${{ matrix.docker_arch }}
          path: dist/linux/${{ matrix.docker_arch }}/turbocable-server
          retention-days: 1

  # ── macOS builds (native runners) ───────────────────────────────────────────
  build-macos:
    name: Build macOS / ${{ matrix.target }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            artifact: turbocable-server-x86_64-macos
          - target: aarch64-apple-darwin
            artifact: turbocable-server-aarch64-macos
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/turbocable-server
          retention-days: 1

  # ── Docker: build multi-platform image from pre-built binaries ───────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build-linux]
    steps:
      - uses: actions/checkout@v4

      - name: Download amd64 binary
        uses: actions/download-artifact@v4
        with:
          name: docker-linux-amd64
          path: dist/linux/amd64

      - name: Download arm64 binary
        uses: actions/download-artifact@v4
        with:
          name: docker-linux-arm64
          path: dist/linux/arm64

      - name: Make binaries executable
        run: |
          chmod +x dist/linux/amd64/turbocable-server
          chmod +x dist/linux/arm64/turbocable-server

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: dist
          file: Dockerfile.dist
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Check image size
        run: |
          docker pull --platform linux/amd64 ghcr.io/${{ env.IMAGE_NAME }}:latest
          size=$(docker image inspect ghcr.io/${{ env.IMAGE_NAME }}:latest \
                   --format '{{.Size}}' | awk '{printf "%.1f", $1/1024/1024}')
          echo "Image size: ${size} MB"
          if (( $(echo "$size > 20" | bc -l) )); then
            echo "ERROR: image exceeds 20 MB limit (${size} MB)" && exit 1
          fi

  # ── GitHub Release with all platform binaries ────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build-linux, build-macos]
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: turbocable-server-*
          path: artifacts
          merge-multiple: false

      - name: Prepare release assets
        run: |
          mkdir release-assets
          for dir in artifacts/turbocable-server-*/; do
            name=$(basename "$dir")
            cp "${dir}turbocable-server" "release-assets/${name}"
            chmod +x "release-assets/${name}"
          done
          echo "Release assets:"
          ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
