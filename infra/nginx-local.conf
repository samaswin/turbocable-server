# TurboCable — nginx WebSocket load balancer (plain HTTP / local / staging)
#
# Used by docker-compose.cluster.yml.  No SSL termination — suitable for
# local development and internal staging environments.
#
# For production with SSL use infra/nginx.conf instead.

worker_processes  auto;
worker_rlimit_nofile 1100000;

events {
    worker_connections 131072;
    multi_accept       on;
    use                epoll;
}

http {
    upstream turbocable {
        least_conn;
        server gw1:9292 max_fails=3 fail_timeout=10s;
        server gw2:9292 max_fails=3 fail_timeout=10s;
        server gw3:9292 max_fails=3 fail_timeout=10s;
        keepalive 1024;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    sendfile    on;
    tcp_nodelay on;
    server_tokens off;

    server {
        listen 80;
        server_name _;

        location /cable {
            proxy_pass         http://turbocable;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   Host             $host;
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 10s;
            proxy_buffering off;
            proxy_pass_header Authorization;
        }

        location /health {
            proxy_pass        http://turbocable/health;
            proxy_http_version 1.1;
            proxy_set_header  Host $host;
            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;
            access_log off;
        }

        location /metrics {
            proxy_pass        http://turbocable/metrics;
            proxy_http_version 1.1;
            proxy_set_header  Host $host;
            access_log off;
        }

        location / {
            return 404;
        }
    }
}
