# NATS server 1 — TurboCable cluster node n1
#
# Part of a 3-node JetStream cluster for production no-data-loss operation.
# Start with:  docker compose -f infra/docker-compose.nats.yml up

server_name: n1
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/nats
  max_memory_store: 1GB
  max_file_store: 10GB
}

cluster {
  name: tc-cluster
  listen: 0.0.0.0:6222
  routes: [
    nats-route://nats2:6222,
    nats-route://nats3:6222
  ]
}

max_connections: 100000
max_payload: 1MB
