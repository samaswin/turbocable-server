[package]
name    = "turbocable-server-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Keep this crate out of the main workspace so `cargo test` in the root
# does not try to compile it (libFuzzer is Linux/nightly-only).
[workspace]

[dependencies]
libfuzzer-sys       = "0.4"
turbocable-server   = { path = "..", features = ["fuzz"] }
serde_json          = "1"
rmp-serde           = "1.3"

[[bin]]
name  = "json_decode"
path  = "fuzz_targets/json_decode.rs"
test  = false
doc   = false

[[bin]]
name  = "msgpack_decode"
path  = "fuzz_targets/msgpack_decode.rs"
test  = false
doc   = false

[[bin]]
name  = "jwt_decode"
path  = "fuzz_targets/jwt_decode.rs"
test  = false
doc   = false
