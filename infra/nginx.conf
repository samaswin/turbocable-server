# TurboCable — nginx WebSocket load balancer
#
# Distributes WebSocket connections across 3 turbocable-server gateway nodes.
# Handles SSL termination; gateways run plain HTTP internally.
#
# Key design decisions:
#   • least_conn    — distributes long-lived WS connections evenly (better than
#                     round-robin, which ignores how many conns each node holds)
#   • No sticky sessions — the gateway is fully stateless; any node can serve
#                     any client.  NATS JetStream handles message delivery across
#                     all nodes transparently.
#   • proxy_read_timeout 3600s — must exceed the gateway's WS ping interval
#                     (default 30 s) or nginx will close idle connections.
#   • /health passthrough — nginx monitors each gateway via active health checks
#                     and removes failing nodes from the upstream automatically.
#
# Prerequisites:
#   1. Replace <YOUR_DOMAIN> with your actual domain.
#   2. Obtain an SSL certificate (Let's Encrypt recommended):
#        certbot --nginx -d <YOUR_DOMAIN>
#   3. Update ssl_certificate / ssl_certificate_key paths accordingly.
#   4. Replace gw1/gw2/gw3 hostnames with actual IPs or DNS names.
#
# Usage (systemd / Docker):
#   nginx -c /path/to/infra/nginx.conf -t   # test config
#   nginx -c /path/to/infra/nginx.conf       # start
#   nginx -c /path/to/infra/nginx.conf -s reload

worker_processes  auto;
worker_rlimit_nofile 1100000;   # must be >= (max_connections × 2) + headroom

events {
    worker_connections  131072;   # per worker; auto × 131072 ≈ room for 1M+ fds
    multi_accept        on;
    use                 epoll;
}

http {
    # ── Upstream — 3 gateway nodes ──────────────────────────────────────────────
    #
    # Replace gw1/gw2/gw3 with actual IP addresses or hostnames.
    # When run via docker-compose.cluster.yml the service names resolve directly.

    upstream turbocable {
        least_conn;   # route new connections to the node with fewest active ones

        server gw1:9292 max_fails=3 fail_timeout=10s;
        server gw2:9292 max_fails=3 fail_timeout=10s;
        server gw3:9292 max_fails=3 fail_timeout=10s;

        # Keep a pool of idle connections to the gateways to avoid TCP handshake
        # overhead when new WS upgrades arrive in bursts.
        keepalive 1024;
    }

    # ── Logging ──────────────────────────────────────────────────────────────────

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/turbocable_access.log  main;
    error_log   /var/log/nginx/turbocable_error.log   warn;

    # ── Global settings ──────────────────────────────────────────────────────────

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75s;
    types_hash_max_size 2048;
    server_tokens       off;

    # ── HTTP → HTTPS redirect ────────────────────────────────────────────────────

    server {
        listen 80;
        server_name <YOUR_DOMAIN>;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS — WebSocket load balancer ─────────────────────────────────────────

    server {
        listen 443 ssl;
        http2  on;
        server_name <YOUR_DOMAIN>;

        # SSL certificate — replace with your actual cert paths.
        # With certbot: /etc/letsencrypt/live/<YOUR_DOMAIN>/
        ssl_certificate     /etc/ssl/certs/<YOUR_DOMAIN>.pem;
        ssl_certificate_key /etc/ssl/private/<YOUR_DOMAIN>.key;

        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       10m;

        # ── WebSocket endpoint (/cable) ─────────────────────────────────────────

        location /cable {
            proxy_pass         http://turbocable;
            proxy_http_version 1.1;

            # Required WebSocket upgrade headers.
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";

            # Forward real client IP so the gateway's per-IP limiter works correctly.
            proxy_set_header   X-Real-IP        $remote_addr;
            proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header   Host             $host;

            # Timeouts — must exceed the gateway's WS ping interval (default 30 s).
            # 3600 s gives 1-hour idle connections before nginx closes them.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
            proxy_connect_timeout 10s;

            # Disable response buffering — WS frames must flow through immediately.
            proxy_buffering off;

            # Pass Authorization header through for JWT-auth gateways.
            proxy_pass_header Authorization;
        }

        # ── Health check endpoint ───────────────────────────────────────────────
        #
        # nginx polls this and removes a gateway from the upstream if it returns
        # a non-2xx response.  Kubernetes / ECS liveness probes can also hit this.

        location /health {
            proxy_pass         http://turbocable/health;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;

            # Fast timeout — unhealthy nodes should be detected quickly.
            proxy_connect_timeout 2s;
            proxy_read_timeout    5s;

            access_log off;   # suppress health check noise from access logs
        }

        # ── Prometheus metrics endpoint ─────────────────────────────────────────
        #
        # Restrict to internal scraper IPs only.  Remove or adjust the allow/deny
        # rules to match your Prometheus server's IP range.

        location /metrics {
            proxy_pass         http://turbocable/metrics;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;

            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny  all;

            access_log off;
        }

        # ── Deny everything else ────────────────────────────────────────────────

        location / {
            return 404;
        }
    }
}
